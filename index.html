var L = "o";
try { L = localStorage.getItem("csc-lang") || "o"; } catch (e) {}
function $(id){return document.getElementById(id)}
function t(k){return T[k][L]}
function render(){
 document.documentElement.lang = L === "o" ? "or" : "en";
 $("lang").textContent = L === "o" ? "English" : "ଓଡ଼ିଆ";
 document.querySelectorAll("[data-t]").forEach(function(el){el.textContent = t(el.dataset.t)});
 document.querySelectorAll("[data-p]").forEach(function(el){el.placeholder = t(el.dataset.p)});
 $("svcGrid").innerHTML = SERVICES.map(function(s){
  return '<details class="svc"><summary><span class="ic">'+s.i+'</span>'+s[L]+'</summary><p><strong>'+t("docs")+'</strong> '+s[L+"d"]+'</p></details>';
 }).join("");
 $("notList").innerHTML = NOTICES.map(function(n){return '<div class="note">'+(n.d?'<small>'+n.d+'</small>':'')+n[L]+'</div>'}).join("");
 $("galGrid").innerHTML = GALLERY.map(function(g){return '<figure class="tile'+(g.w?' wide':'')+'"><img src="'+g.src+'" alt="'+g[L]+'" loading="lazy"><figcaption>'+g[L]+'</figcaption></figure>'}).join("");
 $("revList").innerHTML = REVIEWS.length ? REVIEWS.map(function(r){return '<div class="rev">'+r[L]+'<br><b>'+r.n+'</b></div>'}).join("") : '<div class="rev">'+t("revE")+'</div>';
 var sel = $("fs"); var cur = sel.value;
 sel.innerHTML = '<option value="">'+t("pick")+'</option>' + SERVICES.map(function(s,i){return '<option value="'+i+'">'+s[L]+'</option>'}).join("");
 sel.value = cur;
 $("faqList").innerHTML = FAQ.map(function(f){return '<details class="svc"><summary>'+f["q"+L]+'</summary><p>'+f["a"+L]+'</p></details>'}).join("");
 var tm = $("ftm"), tv = tm.value, o = '<option value="">'+t("timeL")+'</option>';
 for (var h = 9; h <= 18; h++) { var lb = (h > 12 ? h - 12 : h) + (h >= 12 ? " PM" : " AM"); o += '<option value="'+lb+'">'+lb+'</option>'; }
 tm.innerHTML = o; tm.value = tv;
 setOpen();
 $("addr").textContent = ADDRESS || t("adrE");
 var m = $("mapLink"); if (MAPS) { m.href = MAPS; m.hidden = false; }
}
$("lang").onclick = function(){
 L = L === "o" ? "e" : "o";
 try { localStorage.setItem("csc-lang", L); } catch (e) {}
 render();
};
var wa = "https://wa.me/" + WA + "?text=" + encodeURIComponent("Hello CSC HUB / ନମସ୍କାର");

 window.open("https://wa.me/" + WA + "?text=" + encodeURIComponent(msg), "_blank");
});
function setOpen(){
 var hr = +new Intl.DateTimeFormat("en-GB",{hour:"numeric",hour12:false,timeZone:"Asia/Kolkata"}).format(new Date());
 var on = hr >= 9 && hr < 19, el = $("openB");
 el.textContent = on ? t("open") : t("closed"); el.className = "open" + (on ? "" : " off");
}
var dp = null;
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); dp = e; });
$("inst").onclick = function(){ if (dp) { dp.prompt(); } else { $("instTip").textContent = t("instTip"); } };
$("fd").min = new Date().toISOString().slice(0,10);
setInterval(setOpen, 60000);
// If the site is hosted with its own notices.json file, notices load from it automatically.
try { fetch("notices.json",{cache:"no-store"}).then(function(r){return r.ok ? r.json() : null}).then(function(j){ if (j && j.length) { NOTICES = j; render(); } }).catch(function(){}); } catch (e) {}
render();
